quarkus.application.name=token-service
quarkus.application.version=1.0.0
quarkus.http.port=4114
quarkus.log.category."org.jboss.resteasy".level=DEBUG

#Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.driver=org.postgresql.Driver
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=16
quarkus.datasource.devservices.show-logs=true

# Container image settings
quarkus.container-image.build=true
quarkus.container-image.group=otaku
quarkus.container-image.name=token-service

# Set global log level
quarkus.log.level=INFO

# Console logging
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.level=INFO

# OpenAPI and Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.path=/openapi
quarkus.smallrye-openapi.info-title=Token API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API for managing Tokens
quarkus.smallrye-openapi.info-contact-email=jacobsmith@example.com
quarkus.smallrye-openapi.info-contact-name=Jacob Smith
quarkus.smallrye-openapi.info-contact-url=https://smithj16.github.io

# Authentication (if using security)
# quarkus.http.auth.basic=true
# quarkus.security.users.embedded.enabled=true
# quarkus.security.users.embedded.users.admin=adminpassword
# quarkus.security.users.embedded.roles.admin=admin

# Development configuration
%dev.quarkus.log.category."org.acme".level=DEBUG
%dev.quarkus.hibernate-orm.sql-load-script=import.sql

# Kafka configuration
mp.messaging.incoming.transaction-events.connector=smallrye-kafka
mp.messaging.incoming.transaction-events.topic=transaction-events
mp.messaging.incoming.transaction-events.group.id=token-service
mp.messaging.incoming.transaction-events.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.transaction-events.auto.offset.reset=earliest
mp.messaging.incoming.transaction-events.failure-strategy=dead-letter-queue
%dev.quarkus.kafka.devservices.shared=true
quarkus.kafka.devservices.enabled=true
quarkus.kafka.devservices.provider=upstream-kafka
quarkus.kafka.health.enabled=true

# Pre-create Kafka topics in dev mode
%dev.quarkus.kafka.devservices.topic-partitions.transaction-events=1
%dev.quarkus.kafka.devservices.topic-partitions.transaction-events.DLQ=1

# Test configuration
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.datasource.dev-ui.allow-sql=true

# Micrometer + Prometheus metrics
quarkus.micrometer.export.prometheus.enabled=true

# OpenTelemetry (disabled in dev, configurable in prod)
%dev.quarkus.opentelemetry.enabled=false
%prod.quarkus.opentelemetry.tracer.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

# Production configuration
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/db
%prod.quarkus.datasource.username=${DATABASE_USERNAME}
%prod.quarkus.datasource.password=${DATABASE_PASSWORD}
%prod.quarkus.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
%prod.quarkus.s3.aws.credentials.type=env
%prod.quarkus.log.console.level=WARN
%prod.quarkus.hibernate-orm.log.sql=false
%prod.quarkus.log.level=INFO

%dev.quarkus.hibernate-orm.dev-ui.allow-hql=true
